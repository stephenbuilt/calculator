<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced Scientific Calculator</title>

<style>
body{
  background:#000;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  font-family:Arial;
  transition:0.3s;
}

.light{ background:#f3f4f6; }

.calculator{
  background:#000;
  padding:20px;
  border-radius:30px;
  box-shadow:0 0 40px rgba(0,0,0,0.8);
}

.light .calculator{ background:#fff; }

.display{
  width:100%;
  height:80px;
  margin-bottom:10px;
  font-size:28px;
  padding:10px;
  border:none;
  border-radius:15px;
  text-align:right;
  background:#000;
  color:white;
}

.light .display{
  background:#eee;
  color:black;
}

.buttons{
  display:grid;
  grid-template-columns:repeat(5,70px);
  gap:10px;
}

button{
  height:60px;
  font-size:16px;
  border:none;
  border-radius:15px;
  cursor:pointer;
  background:#1f2937;
  color:white;
}

.light button{
  background:#e5e7eb;
  color:black;
}

.operator{ background:#f59e0b; }
.equal{ background:#10b981; }
.clear{ background:#ef4444; }
.backspace{ background:#6366f1; }
.science{ background:#0ea5e9; }

.toggle{
  margin-bottom:8px;
  width:100%;
  height:35px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  background:#374151;
  color:white;
}

.light .toggle{
  background:#ddd;
  color:black;
}
</style>
</head>

<body>

<div class="calculator">

<button class="toggle" onclick="toggleMode()">🌗 Dark / Light</button>

<input type="text" id="display" class="display" readonly>

<div class="buttons">

<button class="clear" onclick="clearDisplay()">C</button>
<button class="backspace" onclick="backspace()">⌫</button>
<button class="science" onclick="appendValue('(')">(</button>
<button class="science" onclick="appendValue(')')">)</button>
<button class="science" onclick="square()">x²</button>

<button class="science" onclick="sqrt()">√</button>
<button class="science" onclick="percent()">%</button>
<button class="science" onclick="sin()">SIN</button>
<button class="science" onclick="cos()">COS</button>
<button class="science" onclick="tan()">TAN</button>

<button class="science" onclick="log()">LOG</button>
<button class="science" onclick="ln()">LN</button>
<button class="operator" onclick="appendValue('/')">÷</button>
<button class="operator" onclick="appendValue('*')">×</button>
<button class="operator" onclick="appendValue('-')">−</button>

<button onclick="appendValue('7')">7</button>
<button onclick="appendValue('8')">8</button>
<button onclick="appendValue('9')">9</button>
<button class="operator" onclick="appendValue('+')">+</button>
<button class="equal" onclick="calculate()">=</button>

<button onclick="appendValue('4')">4</button>
<button onclick="appendValue('5')">5</button>
<button onclick="appendValue('6')">6</button>
<button onclick="appendValue('1')">1</button>
<button onclick="appendValue('2')">2</button>

<button onclick="appendValue('3')">3</button>
<button onclick="appendValue('0')">0</button>
<button onclick="appendValue('.')">.</button>

</div>
</div>

<script>
function getDisplay(){
  return document.getElementById("display");
}

function appendValue(v){
  getDisplay().value += v;
}

function clearDisplay(){
  getDisplay().value = "";
}

function backspace(){
  let d = getDisplay();
  d.value = d.value.slice(0,-1);
}

function calculate(){
  try{
    getDisplay().value = eval(getDisplay().value);
  }catch{
    getDisplay().value = "Error";
  }
}

function square(){
  let d = getDisplay();
  d.value = Math.pow(eval(d.value),2);
}

function sqrt(){
  let d = getDisplay();
  d.value = Math.sqrt(eval(d.value));
}

function percent(){
  let d = getDisplay();
  d.value = eval(d.value)/100;
}

/* TRIG uses degrees */
function sin(){
  let d = getDisplay();
  d.value = Math.sin(eval(d.value) * Math.PI/180).toFixed(6);
}

function cos(){
  let d = getDisplay();
  d.value = Math.cos(eval(d.value) * Math.PI/180).toFixed(6);
}

function tan(){
  let d = getDisplay();
  d.value = Math.tan(eval(d.value) * Math.PI/180).toFixed(6);
}

function log(){
  let d = getDisplay();
  d.value = Math.log10(eval(d.value)).toFixed(6);
}

function ln(){
  let d = getDisplay();
  d.value = Math.log(eval(d.value)).toFixed(6);
}

function toggleMode(){
  document.body.classList.toggle("light");
}

/* Keyboard Support */
document.addEventListener("keydown", e=>{
  let k = e.key;

  if(!isNaN(k) || "+-*/().".includes(k)){
    appendValue(k);
  }
  else if(k==="Enter") calculate();
  else if(k==="Backspace") backspace();
  else if(k.toLowerCase()==="c") clearDisplay();
});
</script>

</body>
</html>
